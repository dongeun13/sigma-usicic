<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SIGMA Music</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,"Noto Sans KR",sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,.file-label{font:inherit}
.app{min-height:100vh;padding-bottom:120px;transition:margin-right 0.3s ease}
header{height:64px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #272727;background:#101010;position:sticky;top:0;z-index:10}
.logo{font-size:20px;font-weight:800}.logo span{color:#ff4d6d}
.credit{font-size:11px;color:#777;letter-spacing:1px;font-weight:bold}
.layout{max-width:1180px;margin:auto;display:grid;grid-template-columns:245px 1fr;gap:24px;padding:24px 20px}
.sidebar{background:#151515;border-radius:18px;padding:16px;height:max-content;position:sticky;top:88px}
.sidebar h3{font-size:14px;color:#aaa;margin:5px 10px 12px}
.playlists{display:flex;flex-direction:column;gap:5px}
.pl-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;border-radius:10px;background:transparent;color:#ddd;text-align:left;cursor:pointer}
.pl-item:hover,.pl-item.active{background:#292020;color:#fff}
.pl-thumb{width:38px;height:38px;border-radius:7px;object-fit:cover;background:#292929;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.pl-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.new-pl{width:100%;margin-top:10px;padding:10px;border:1px dashed #555;border-radius:10px;background:transparent;color:#bbb;cursor:pointer}
main{min-width:0}
.hero{display:flex;gap:22px;align-items:center;padding:24px;border-radius:20px;background:linear-gradient(135deg,#292929,#151515);margin-bottom:18px}
.cover{width:140px;height:140px;border-radius:14px;object-fit:cover;background:#242424;box-shadow:0 12px 30px #0008;flex-shrink:0}
.hero h1{margin:0 0 7px;font-size:26px;word-break:break-all}.hero p{margin:0;color:#aaa;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
button,.file-label{border:0;border-radius:999px;padding:9px 15px;background:#fff;color:#111;font-weight:700;cursor:pointer}
button.secondary,.cover-btn{background:#292929;color:#fff}
input[type=file]{display:none}
.search{width:100%;padding:12px 15px;border:1px solid #333;border-radius:12px;background:#171717;color:#fff;outline:none;margin-bottom:15px}
.list{border-radius:16px;overflow:hidden;background:#171717}
.row{display:grid;grid-template-columns:40px 44px 1fr 75px 44px;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #282828;cursor:pointer}
.row:last-child{border-bottom:0}.row:hover{background:#222}.row.active{background:#302020}
.num{color:#888;text-align:center;font-size:13px}.song-cover{width:44px;height:44px;border-radius:7px;object-fit:cover;background:#292929}
.title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:12px;color:#999;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11px;color:#777;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duration{color:#999;font-size:12px;text-align:right}
.remove{background:transparent;color:#888;padding:5px;font-size:18px}
.empty{padding:55px 20px;text-align:center;color:#777;font-size:14px}
.modal-bg{display:none;position:fixed;inset:0;background:#0009;z-index:40;align-items:center;justify-content:center;padding:20px}
.modal{width:min(420px,100%);background:#191919;border:1px solid #333;border-radius:18px;padding:22px}
.modal h2{margin-top:0}.modal input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#101010;color:#fff;font-size:15px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* 플레이어 모바일 최적화 */
.player{position:fixed;left:0;right:0;bottom:0;height:94px;background:#191919;border-top:1px solid #333;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:10px 20px;gap:15px;z-index:30}
.now{display:flex;align-items:center;gap:10px;min-width:0}.now img{width:50px;height:50px;border-radius:8px;object-fit:cover;background:#292929;flex-shrink:0}
.now-title{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now-artist{color:#999;font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{text-align:center}
.control-row{display:flex;align-items:center;justify-content:center;gap:4px}
.controls button{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:#d5d5d5;font-size:16px;padding:0;cursor:pointer}
.controls .play{width:42px;height:42px;font-size:20px;background:#fff;color:#111;box-shadow:0 4px 12px #0007}
.controls .mode-on{color:#ff4d6d}
.progress{width:100%;margin-top:2px;accent-color:#ff4d6d;cursor:pointer}
.right{display:flex;align-items:center;justify-content:flex-end;gap:12px;color:#aaa;font-size:12px}
.lyrics-btn{background:#292929;color:#fff;border:0;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:bold}

/* 가사 패널 */
.lyrics-panel{position:fixed;top:0;right:-340px;width:320px;height:calc(100vh - 94px);background:#151515;border-left:1px solid #333;z-index:35;padding:20px;display:flex;flex-direction:column;transition:right 0.3s ease;box-shadow:-5px 0 20px #0008}
.lyrics-panel.open{right:0}
.lyrics-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;padding-bottom:10px;margin-bottom:14px}
.lyrics-title{font-size:17px;font-weight:bold;color:#ff4d6d;margin:0}
.lyrics-edit-btn{background:#292929;color:#fff;border:0;padding:5px 10px;border-radius:4px;font-size:11px;cursor:pointer}
.lyrics-content{flex:1;overflow-y:auto;white-space:pre-wrap;font-size:13px;color:#bbb;line-height:1.6}
.lyrics-textarea{width:100%;flex:1;background:#101010;color:#fff;border:1px solid #444;border-radius:8px;padding:10px;font-size:13px;resize:none;display:none;line-height:1.5;outline:none}

/* 태블릿 및 모바일 반응형 브레이크포인트 */
@media(max-width:900px){
.layout{grid-template-columns:1fr;padding:16px 14px}
.sidebar{position:static;margin-bottom:10px}
.playlists{flex-direction:row;overflow-x:auto;padding-bottom:5px}
.playlists::-webkit-scrollbar{height:4px}
.playlists::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.pl-item{min-width:140px;flex-shrink:0}
.new-pl{width:140px;flex-shrink:0;margin-top:0}
}

@media(max-width:700px){
.hero{flex-direction:column;align-items:flex-start;gap:16px;padding:18px}
.cover{width:110px;height:110px}
.hero h1{font-size:22px}
.player{grid-template-columns:1fr auto;height:auto;padding:12px 14px;gap:10px;flex-direction:column}
.now{width:100%}
.controls{width:100%;display:flex;flex-direction:column;align-items:center}
.control-row{width:100%;justify-content:space-around}
.controls button{width:40px;height:40px;font-size:18px}
.controls .play{width:48px;height:48px;font-size:22px}
.right{display:none}
.app{padding-bottom:170px}
.lyrics-panel{width:100%;right:-100%;height:calc(100vh - 170px)}
}

@media(max-width:480px){
.row{grid-template-columns:30px 38px 1fr 38px}
.row .meta,.row .duration{display:none}
}
</style>
</head>
<body>
<div class="app" id="app">
<header>
  <div class="logo">SIGMA <span>MUSIC</span></div>
  <div class="credit">BY DONGEUN</div>
</header>

<div class="layout">
<aside class="sidebar">
<h3>내 재생목록</h3>
<div class="playlists" id="playlists"></div>
<button class="new-pl" id="newPlaylist">+ 새 재생목록</button>
</aside>

<main>
<section class="hero">
<img class="cover" id="playlistCover" alt="재생목록 사진">
<div>
<h1 id="playlistName">내 음악</h1>
<p id="playlistInfo">음악을 추가해서 나만의 재생목록을 만들어보세요.</p>
<div class="actions">
<label class="file-label" for="audioInput">음악 추가</label>
<input id="audioInput" type="file" accept="audio/*" multiple>
<label class="file-label cover-btn" for="coverInput">커버 변경</label>
<input id="coverInput" type="file" accept="image/*">
<button class="secondary" id="playAll">전체 재생</button>
<button class="secondary" id="clearAll">전체 삭제</button>
</div>
</div>
</section>

<input class="search" id="search" placeholder="이 재생목록에서 음악 검색...">
<div class="list" id="list"></div>
</main>
</div>
</div>

<div class="lyrics-panel" id="lyricsPanel">
  <div class="lyrics-header">
    <h3 class="lyrics-title">가사</h3>
    <button class="lyrics-edit-btn" id="editLyricsBtn">가사 수정</button>
  </div>
  <div class="lyrics-content" id="lyricsContent">음악을 재생하면 가사가 표시됩니다.</div>
  <textarea class="lyrics-textarea" id="lyricsTextarea" placeholder="여기에 가사를 입력하세요..."></textarea>
</div>

<div class="modal-bg" id="modalBg">
<div class="modal">
<h2 id="modalTitle">새 재생목록</h2>
<input id="playlistNameInput" type="text" maxlength="40" placeholder="예: 공부할 때 듣는 노래">
<div class="modal-actions"><button class="secondary" id="cancelModal">취소</button><button id="createPlaylist">만들기</button></div>
</div>
</div>

<div class="player">
<div class="now">
<img id="nowCover" alt="">
<div><div class="now-title" id="nowTitle">재생할 음악을 선택하세요</div><div class="now-artist" id="nowArtist">아티스트 미지정</div></div>
</div>
<div class="controls">
<div class="control-row">
<button id="prev" title="이전 곡">⏮</button>
<button id="mode" title="전체 반복">↻</button>
<button class="play" id="play" title="재생 / 일시정지">▶</button>
<button id="next" title="다음 곡">⏭</button>
<button class="lyrics-btn" id="toggleLyrics" style="margin-left:4px;">가사</button>
</div>
<input class="progress" id="progress" type="range" min="0" max="100" value="0">
</div>
<div class="right">
  <span id="time">0:00 / 0:00</span>
  <button class="lyrics-btn" id="toggleLyricsDesktop">가사</button>
</div>
</div>

<audio id="audio"></audio>

<script>
localforage.config({ name: 'SigmaMusicDB' });

const audio=document.getElementById("audio");
const audioInput=document.getElementById("audioInput");
const coverInput=document.getElementById("coverInput");
const list=document.getElementById("list");
const playlistsEl=document.getElementById("playlists");
const search=document.getElementById("search");
const playlistName=document.getElementById("playlistName");
const playlistInfo=document.getElementById("playlistInfo");
const playlistCover=document.getElementById("playlistCover");
const nowCover=document.getElementById("nowCover");
const playBtn=document.getElementById("play");
const modeBtn=document.getElementById("mode");
const progress=document.getElementById("progress");
const timeEl=document.getElementById("time");
const nowTitle=document.getElementById("nowTitle");
const nowArtist=document.getElementById("nowArtist");

const lyricsPanel=document.getElementById("lyricsPanel");
const lyricsContent=document.getElementById("lyricsContent");
const lyricsTextarea=document.getElementById("lyricsTextarea");
const editLyricsBtn=document.getElementById("editLyricsBtn");
const toggleLyricsBtn=document.getElementById("toggleLyrics");
const toggleLyricsDesktop=document.getElementById("toggleLyricsDesktop");
const app=document.getElementById("app");

let playlists=[{id:1,name:"내 음악",cover:"",coverFile:null,tracks:[]}];
let activeId=1,current=-1,mode="all";
let isLyricsOpen = false;
let isEditingLyrics = false;

async function saveData() {
  await localforage.setItem('playlists', playlists);
  await localforage.setItem('activeId', activeId);
  await localforage.setItem('mode', mode);
}

async function loadData() {
  const savedPlaylists = await localforage.getItem('playlists');
  if (savedPlaylists) {
    playlists = savedPlaylists;
    playlists.forEach(p => {
      if (p.coverFile) p.cover = URL.createObjectURL(p.coverFile);
      p.tracks.forEach(t => {
        if (t.file) t.url = URL.createObjectURL(t.file);
        if (t.coverBlob) t.cover = URL.createObjectURL(t.coverBlob);
      });
    });
  }
  activeId = (await localforage.getItem('activeId')) || 1;
  mode = (await localforage.getItem('mode')) || "all";
  updateModeUI();
  render();
}

function active(){return playlists.find(p=>p.id===activeId)}
function makeId(){return Date.now()+Math.random()}

function renderPlaylists(){
  playlistsEl.innerHTML=playlists.map(p=>`
    <button class="pl-item ${p.id===activeId?'active':''}" data-pl="${p.id}">
      <div class="pl-thumb">${p.cover?`<img src="${p.cover}" style="width:100%;height:100%;object-fit:cover;border-radius:7px">`:""}</div>
      <div class="pl-name">${escapeHtml(p.name)}</div>
    </button>`).join("");
  playlistsEl.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{
    selectPlaylist(Number(b.dataset.pl));
  });
}

function selectPlaylist(id){
  if(id===activeId)return;
  audio.pause();audio.src="";current=-1;activeId=id;search.value="";
  nowTitle.textContent="재생할 음악을 선택하세요";
  nowArtist.textContent="아티스트 미지정";
  setLyricsDisplay("음악을 재생하면 가사가 표시됩니다.");
  saveData();
  render();
}

function render(){
  const p=active();
  playlistName.textContent=p.name;
  playlistInfo.textContent=`${p.tracks.length}곡 · 나만의 재생목록`;
  playlistCover.src=p.cover||"";
  renderPlaylists();
  
  const q=search.value.trim().toLowerCase();
  const visible=p.tracks.map((t,i)=>({t,i})).filter(x=>x.t.name.toLowerCase().includes(q));
  
  if(!visible.length){list.innerHTML='<div class="empty">'+(p.tracks.length?'검색 결과가 없습니다.':'이 재생목록에 음악이 없습니다.<br>「음악 추가」로 음악 파일을 넣어보세요.')+'</div>';return}
  
  list.innerHTML=visible.map(({t,i})=>`
    <div class="row ${i===current?'active':''}" data-index="${i}">
      <div class="num">${i+1}</div>
      <img class="song-cover" src="${t.cover||p.cover||''}" onerror="this.style.visibility='hidden'">
      <div>
        <div class="title">${escapeHtml(t.name)}</div>
        <div class="artist">${escapeHtml(t.artist||"아티스트 미지정")}</div>
        <div class="meta">${escapeHtml(t.album||"앨범 미지정")}</div>
      </div>
      <div class="duration">${i===current&&audio.duration?fmt(audio.duration):""}</div>
      <button class="remove" data-remove="${i}" title="삭제">×</button>
    </div>`).join("");
    
  list.querySelectorAll(".row").forEach(row=>row.onclick=e=>{
    if(e.target.dataset.remove!==undefined)return;
    load(Number(row.dataset.index));audio.play();
  });
  list.querySelectorAll("[data-remove]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();removeTrack(Number(b.dataset.remove));
  });
}

function setLyricsDisplay(text) {
  if (isEditingLyrics) exitLyricsEditMode(false);
  lyricsContent.textContent = text || "가사가 등록되지 않은 곡입니다.";
  lyricsTextarea.value = text || "";
}

function load(i){
  const p=active(); if(!p.tracks.length)return;
  current=(i+p.tracks.length)%p.tracks.length;
  const t=p.tracks[current];
  audio.src=t.url;
  nowTitle.textContent=t.name;
  nowArtist.textContent=`${t.artist||"아티스트 미지정"} · ${t.album||"앨범 미지정"}`;
  nowCover.src=t.cover||p.cover||"";
  setLyricsDisplay(t.lyrics);
  render();
}

function removeTrack(i){
  const p=active(),t=p.tracks[i];
  if(i===current){audio.pause();audio.src="";current=-1;nowTitle.textContent="재생할 음악을 선택하세요";setLyricsDisplay("음악을 재생하면 가사가 표시됩니다.");}
  else if(i<current)current--;
  URL.revokeObjectURL(t.url); if(t.cover)URL.revokeObjectURL(t.cover);
  p.tracks.splice(i,1);
  saveData();
  render();
}

function nextTrack(){
  const p=active();if(!p.tracks.length)return;
  if(mode==="one"){audio.currentTime=0;audio.play();return}
  if(mode==="shuffle"){
    let n=current;if(p.tracks.length>1)while(n===current)n=Math.floor(Math.random()*p.tracks.length);
    load(n);
  }else load(current<p.tracks.length-1?current+1:0);
  audio.play();
}

audioInput.onchange=async e=>{
  const files=[...e.target.files];
  if(!files.length)return;
  const p=active();
  let added = false;
  
  for (const file of files) {
    await new Promise(resolve => {
      jsmediatags.read(file, {
        onSuccess: function(tag) {
          const tags = tag.tags;
          let cover = "", coverBlob = null;
          if (tags.picture) {
            const data = tags.picture.data;
            const format = tags.picture.format;
            coverBlob = new Blob([new Uint8Array(data)], { type: format });
            cover = URL.createObjectURL(coverBlob);
          }
          let lyricsText = tags.lyrics ? tags.lyrics.lyrics : "";
          p.tracks.push({
            id: makeId(),
            name: tags.title || file.name.replace(/\.[^/.]+$/, ""),
            file: file,
            url: URL.createObjectURL(file),
            coverBlob: coverBlob,
            cover: cover,
            artist: tags.artist || "아티스트 미지정",
            album: tags.album || "앨범 미지정",
            lyrics: lyricsText
          });
          added = true;
          resolve();
        },
        onError: function() {
          p.tracks.push({
            id: makeId(),
            name: file.name.replace(/\.[^/.]+$/, ""),
            file: file,
            url: URL.createObjectURL(file),
            coverBlob: null,
            cover: "",
            artist: "아티스트 미지정",
            album: "앨범 미지정",
            lyrics: ""
          });
          added = true;
          resolve();
        }
      });
    });
  }
  if(added) {
    saveData();
    render();
    if(current===-1&&p.tracks.length)load(0);
  }
  audioInput.value="";
};

coverInput.onchange=e=>{
  const file=e.target.files[0];if(!file)return;
  const p=active();if(p.cover)URL.revokeObjectURL(p.cover);
  p.coverFile = file;
  p.cover=URL.createObjectURL(file);
  saveData();
  render();
  if(current>=0){nowCover.src=p.tracks[current].cover||p.cover}
  coverInput.value="";
};

document.getElementById("playAll").onclick=()=>{if(active().tracks.length){load(0);audio.play()}};
document.getElementById("clearAll").onclick=()=>{
  const p=active();if(!p.tracks.length)return;
  if(confirm("현재 재생목록의 모든 음악을 삭제할까요?")){
    p.tracks.forEach(t=>{URL.revokeObjectURL(t.url);if(t.cover)URL.revokeObjectURL(t.cover)});
    p.tracks=[];current=-1;audio.pause();audio.src="";
    nowTitle.textContent="재생할 음악을 선택하세요";
    nowArtist.textContent="아티스트 미지정";
    setLyricsDisplay("음악을 재생하면 가사가 표시됩니다.");
    saveData();
    render();
  }
};

document.getElementById("play").onclick=()=>audio.paused?(current===-1&&active().tracks.length?load(0):null,audio.play()):audio.pause();
document.getElementById("prev").onclick=()=>{if(!active().tracks.length)return;if(audio.currentTime>3){audio.currentTime=0;return}load(current-1);audio.play()};
document.getElementById("next").onclick=nextTrack;

function updateModeUI() {
  modeBtn.textContent=mode==="all"?"↻":mode==="one"?"↻¹":"⌘";
  modeBtn.title=mode==="all"?"전체 반복":mode==="one"?"한 곡 반복":"랜덤 재생";
  modeBtn.classList.toggle("mode-on",true);
}

document.getElementById("mode").onclick=()=>{
  mode=mode==="all"?"one":mode==="one"?"shuffle":"all";
  updateModeUI();
  saveData();
};

audio.onended=nextTrack;
audio.onplay=()=>playBtn.textContent="⏸";
audio.onpause=()=>playBtn.textContent="▶";
audio.ontimeupdate=()=>{
  if(!audio.duration)return;
  progress.value=audio.currentTime/audio.duration*100;
  timeEl.textContent=`${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
};
audio.onloadedmetadata=()=>{timeEl.textContent=`0:00 / ${fmt(audio.duration)}`;render()};
progress.oninput=()=>{if(audio.duration)audio.currentTime=progress.value/100*audio.duration};
search.oninput=render;

const modalBg=document.getElementById("modalBg"),nameInput=document.getElementById("playlistNameInput");
document.getElementById("newPlaylist").onclick=()=>{nameInput.value="";modalBg.style.display="flex";nameInput.focus()};
document.getElementById("cancelModal").onclick=()=>modalBg.style.display="none";
document.getElementById("createPlaylist").onclick=()=>{
  const name=nameInput.value.trim()||"새 재생목록";
  const p={id:makeId(),name,cover:"",coverFile:null,tracks:[]};
  playlists.push(p);modalBg.style.display="none";activeId=p.id;current=-1;
  saveData();
  render();
};
modalBg.onclick=e=>{if(e.target===modalBg)modalBg.style.display="none"};

function toggleLyricsPanel() {
  isLyricsOpen = !isLyricsOpen;
  if(isLyricsOpen){
    lyricsPanel.classList.add('open');
    if(window.innerWidth > 700) app.style.marginRight = "320px";
  } else {
    lyricsPanel.classList.remove('open');
    app.style.marginRight = "0";
    if(isEditingLyrics) exitLyricsEditMode(true);
  }
}
toggleLyricsBtn.onclick = toggleLyricsPanel;
toggleLyricsDesktop.onclick = toggleLyricsPanel;

function exitLyricsEditMode(save) {
  isEditingLyrics = false;
  editLyricsBtn.textContent = "가사 수정";
  if(save && current >= 0) {
    const p = active();
    if(p && p.tracks[current]) {
      p.tracks[current].lyrics = lyricsTextarea.value;
      lyricsContent.textContent = lyricsTextarea.value || "가사가 등록되지 않은 곡입니다.";
      saveData();
    }
  }
  lyricsContent.style.display = "block";
  lyricsTextarea.style.display = "none";
}

editLyricsBtn.onclick = () => {
  if(current < 0) {
    alert("재생 중인 곡이 없습니다.");
    return;
  }
  isEditingLyrics = !isEditingLyrics;
  if(isEditingLyrics) {
    editLyricsBtn.textContent = "저장";
    lyricsTextarea.value = active().tracks[current].lyrics || "";
    lyricsContent.style.display = "none";
    lyricsTextarea.style.display = "block";
    lyricsTextarea.focus();
  } else {
    exitLyricsEditMode(true);
  }
};

function fmt(sec){if(!isFinite(sec))return"0:00";return`${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,"0")}`}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

loadData();
</script>
